# ===============================
# Application
# ===============================
spring.application.name=Ems-Backend
server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB

# ===============================
# Datasource (MySQL)
# Set DB_USERNAME and DB_PASSWORD as environment variables,
# OR copy application.properties.example → application-local.properties
# and run with: --spring.profiles.active=local
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/ems_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# CORS - origins allowed to call the API (comma separated)
# ===============================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:3001

# ===============================
# API docs (springdoc-openapi)
# Swagger UI available at http://localhost:8080/swagger-ui.html
# ===============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===============================
# Gmail SMTP — OTP Email Delivery
# Set MAIL_USERNAME and MAIL_PASSWORD as environment variables.
# Generate a Gmail App Password at: https://myaccount.google.com/apppasswords
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Sender display name shown in email
app.mail.from-name=EMS Admin Portal
